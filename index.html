<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ankit Patel's Island Lab</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Ankit Patel's apps and AI tools as workshops on a floating island, plus a few things to play with.">
<meta property="og:title" content="Ankit Patel's Island Lab">
<meta property="og:description" content="Apps and AI tools by Ankit Patel, one workshop each on a floating island. Tap a building, or skip a stone in the pond.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://ankitpatel.si/">
<meta name="theme-color" content="#0b1238">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cellipse cx='32' cy='26' rx='26' ry='11' fill='%235fd0a2'/%3E%3Cpath d='M6 27 L58 27 L36 58 Z' fill='%233a2f7c'/%3E%3Ccircle cx='32' cy='18' r='5' fill='%23ffcf6b'/%3E%3C/svg%3E">
<style>body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700;800&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: phone-first. A full-screen island you drag and pinch, the masthead over the sky, a play dock at the right thumb, and the harbor board pinned along the bottom (right column on wide screens). Sky follows a day, dusk or night dial. */
:root {
  --sky-top: #0b1238; --sky-mid: #253a8a; --sky-low: #d9789a; --sky-horizon: #f4bf86;
  --grass-1: #5fd0a2; --grass-2: #2f9a7c; --grass-hi: #7ee0b6;
  --cliff-1: #6b5aa8; --cliff-2: #2a2160; --rock-1: #3a2f7c; --rock-2: #140f3a;
  --wall-l: #e9ecfa; --wall-r: #a9b2d8; --roof: #f6f7ff;
  --stars: .9; --sun: 1; --moon: 0; --flies: .55;
  --ink: #f3f5ff; --ink-dim: #b8c0e6;
  --panel: #0e1530; --panel-2: #162046; --line: #2b3769;
  --amber: #ffcf6b;
  --live: #4ef09a; --test: #3fd2ff; --dev: #ffcf6b; --pre: #ff9a6b;
  --font-display: "Sora", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Figtree", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --board-w: 330px;
  color-scheme: dark;
}
.scene[data-time="day"] {
  --sky-top: #3f8fe0; --sky-mid: #79bff5; --sky-low: #c6e8ff; --sky-horizon: #fff0d0;
  --grass-1: #74e0ae; --grass-2: #3cb886; --grass-hi: #a6f0cb;
  --cliff-1: #8d7fd0; --cliff-2: #4a3d93; --rock-1: #5a4cae; --rock-2: #2a2070;
  --wall-l: #ffffff; --wall-r: #c4cbe8; --roof: #ffffff;
  --stars: 0; --sun: 1; --moon: 0; --flies: 0;
}
.scene[data-time="night"] {
  --sky-top: #03051a; --sky-mid: #0b1446; --sky-low: #1f2468; --sky-horizon: #3a2d73;
  --grass-1: #2f7f6c; --grass-2: #1a4f4a; --grass-hi: #3d8f7b;
  --cliff-1: #3d3478; --cliff-2: #161240; --rock-1: #221b55; --rock-2: #0a0824;
  --wall-l: #8f97c4; --wall-r: #5d6596; --roof: #a7aed6;
  --stars: 1; --sun: 0; --moon: 1; --flies: 1;
}
html, body { height: 100%; }
body {
  background: var(--sky-top); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  overflow: hidden; -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
}
button { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; }

.app { position: relative; height: 100%; display: grid; grid-template-columns: 1fr; }
@media (min-width: 900px) { .app { grid-template-columns: 1fr var(--board-w); } }

/* ---------- Scene ---------- */
.scene {
  position: relative; min-width: 0; height: 100%; overflow: hidden;
  background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 42%, var(--sky-low) 76%, var(--sky-horizon) 100%);
  transition: background 1s ease;
}
.scene svg.world { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
.scene svg.world.dragging { cursor: grabbing; }
@media (max-width: 899px) { .scene svg.world { height: calc(100% - var(--mboard-h, 200px) + 18px); } }
.g-stop-1 { stop-color: var(--grass-1); } .g-stop-2 { stop-color: var(--grass-2); }
.c-stop-1 { stop-color: var(--cliff-1); } .c-stop-2 { stop-color: var(--cliff-2); }
.r-stop-1 { stop-color: var(--rock-1); } .r-stop-2 { stop-color: var(--rock-2); }
.grass-hi { fill: var(--grass-hi); }
.wall-l { fill: var(--wall-l); } .wall-r { fill: var(--wall-r); } .roof { fill: var(--roof); }
.stars { opacity: var(--stars); transition: opacity 1s; }
.sun { opacity: var(--sun); transition: opacity 1s; }
.moon { opacity: var(--moon); transition: opacity 1s; }
.flies { opacity: var(--flies); transition: opacity 1s; }
.scene[data-time="night"] .win { filter: brightness(1.25); }

.masthead {
  position: absolute; z-index: 3; top: 0; left: 0; right: 0;
  padding-top: calc(env(safe-area-inset-top, 0px) + 14px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  pointer-events: none;
  background: linear-gradient(180deg, rgba(5, 8, 30, .45), rgba(5, 8, 30, 0));
  padding-bottom: 18px;
}
.masthead .eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--amber); }
.masthead h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(24px, 5vw, 44px); line-height: 1.04; margin: 4px 0 6px; letter-spacing: -0.02em; text-wrap: balance; text-shadow: 0 2px 18px rgba(5, 8, 30, .5); }
.masthead p { margin: 0; max-width: 44ch; color: var(--ink); opacity: .85; font-size: 13.5px; line-height: 1.4; text-shadow: 0 1px 10px rgba(5, 8, 30, .6); }

/* hint + toast */
.hint, .toast {
  position: absolute; z-index: 5; left: 50%; transform: translateX(-50%);
  background: rgba(10, 16, 40, .82); border: 1px solid var(--line); color: var(--ink);
  border-radius: 999px; padding: 8px 14px; font-size: 13px; font-weight: 500; white-space: nowrap; pointer-events: none;
  transition: opacity .35s, transform .35s;
}
.hint { bottom: calc(var(--mboard-h, 0px) + 14px); left: max(16px, env(safe-area-inset-left, 0px)); transform: none; }
@media (min-width: 900px) { .hint { bottom: 22px; } }
.hint.gone { opacity: 0; }
.toast { top: calc(env(safe-area-inset-top, 0px) + 158px); opacity: 0; transform: translate(-50%, -8px); max-width: calc(100% - 32px); white-space: normal; text-align: center; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast b { color: var(--amber); }

/* play dock */
.dock {
  position: absolute; z-index: 6; right: max(12px, env(safe-area-inset-right, 0px));
  bottom: calc(var(--mboard-h, 0px) + 12px);
  display: flex; flex-direction: column; gap: 8px; align-items: flex-end;
}
@media (min-width: 900px) { .dock { bottom: 22px; } }
.dock-btn {
  width: 48px; height: 48px; border-radius: 50%; border: 1px solid var(--line);
  background: rgba(10, 16, 40, .84); display: grid; place-items: center; cursor: pointer; position: relative;
}
.dock-btn svg { width: 22px; height: 22px; }
.dock-btn .badge { position: absolute; top: -4px; right: -6px; font-family: var(--font-mono); font-size: 10.5px; font-weight: 700; background: var(--amber); color: #1a1530; border-radius: 999px; padding: 1px 6px; }
.dock-btn[aria-pressed="false"] { opacity: .65; }
.finds {
  position: absolute; z-index: 7; right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(var(--mboard-h, 0px) + 12px);
  width: min(300px, calc(100% - 24px)); background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
  padding: 14px 14px 10px; box-shadow: 0 18px 50px rgba(0, 0, 0, .45);
}
@media (min-width: 900px) { .finds { bottom: 22px; } }
.finds h3 { margin: 0 0 2px; font-family: var(--font-display); font-size: 16px; }
.finds .sub { font-size: 12.5px; color: var(--ink-dim); margin: 0 0 8px; }
.finds ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.finds li { display: grid; grid-template-columns: 18px 1fr; gap: 8px; font-size: 13.5px; align-items: start; }
.finds li .m { color: var(--line); font-weight: 700; }
.finds li.got .m { color: var(--amber); }
.finds li:not(.got) .t { color: var(--ink-dim); font-style: italic; }
.finds .row-end { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
.finds button.lnk { background: none; border: 0; color: var(--ink-dim); cursor: pointer; font-size: 12.5px; min-height: 36px; padding: 0 4px; }

/* building + toys */
.bld, .toy { cursor: pointer; outline: none; }
.bld .holo { transform-box: fill-box; transform-origin: center; transition: transform .25s ease; }
.bld:hover .holo, .bld:focus-visible .holo, .bld.is-hot .holo { transform: scale(1.18); }
.bld:focus-visible .hit, .toy:focus-visible .hit { stroke: var(--amber); stroke-width: 3; stroke-dasharray: 6 6; }
.win { animation: winGlow 3.6s ease-in-out infinite; }
@keyframes winGlow { 0%,100% { opacity: .78 } 50% { opacity: 1 } }
.twinkle { animation: tw 4s ease-in-out infinite; }
@keyframes tw { 0%,100% { opacity: .25 } 50% { opacity: 1 } }
.fall { stroke-dasharray: 10 14; animation: fall 1.1s linear infinite; }
@keyframes fall { to { stroke-dashoffset: -24 } }
.cloud { animation: drift 80s linear infinite; }
@keyframes drift { from { transform: translateX(-200px) } to { transform: translateX(1300px) } }
.ring-pulse { animation: rp 3s ease-in-out infinite; }
@keyframes rp { 0%,100% { opacity: .3 } 50% { opacity: .75 } }
.bloom { transform-box: fill-box; transform-origin: 50% 100%; animation: grow .9s cubic-bezier(.2,1.4,.4,1) both; }
@keyframes grow { from { transform: scale(0) } to { transform: scale(1) } }
.bloom .head { animation: breathe 3s ease-in-out infinite; }
@keyframes breathe { 0%,100% { opacity: .8 } 50% { opacity: 1 } }
.fly { animation: flit var(--d, 6s) ease-in-out infinite alternate; }
@keyframes flit { from { transform: translate(0, 0) } to { transform: translate(var(--fx), var(--fy)) } }
.ripple { transform-box: fill-box; transform-origin: center; animation: ripple .9s ease-out forwards; }
@keyframes ripple { from { transform: scale(.2); opacity: .9 } to { transform: scale(1.6); opacity: 0 } }
.zz { animation: zz 2.4s ease-in-out infinite; }
@keyframes zz { 0% { opacity: 0; transform: translate(0, 0) } 30% { opacity: 1 } 100% { opacity: 0; transform: translate(8px, -16px) } }
.ping { transform-box: fill-box; transform-origin: center; animation: ping .6s ease-out; }
@keyframes ping { 0% { transform: scale(1) } 40% { transform: scale(1.25) } 100% { transform: scale(1) } }

/* ---------- Harbor board ---------- */
.board { position: relative; z-index: 8; min-width: 0; background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; height: 100%; }
.board-head { padding: 18px 18px 12px; border-bottom: 1px solid var(--line); display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.board-head .title { font-family: var(--font-mono); font-weight: 700; letter-spacing: .14em; text-transform: uppercase; font-size: 12px; color: var(--amber); }
.board-head .sub { font-family: var(--font-mono); font-size: 11px; color: var(--ink-dim); }
.board-list { list-style: none; margin: 0; padding: 6px 8px 16px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 2px; }
.row { width: 100%; text-align: left; background: transparent; border: 0; border-radius: 10px; cursor: pointer; display: grid; grid-template-columns: 34px 1fr auto; gap: 4px 10px; align-items: center; padding: 10px; }
.row:hover, .row.is-hot { background: var(--panel-2); }
.row .dockno { font-family: var(--font-mono); font-size: 11px; color: var(--ink-dim); }
.row .nm { font-family: var(--font-display); font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 8px; min-width: 0; }
.row .nm .ic { color: var(--c); display: inline-flex; flex: none; }
.row .pitch { grid-column: 2 / 4; font-size: 12.5px; color: var(--ink-dim); line-height: 1.4; }
.pill { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .04em; text-transform: uppercase; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; color: var(--ink-dim); }
.pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--s); box-shadow: 0 0 8px var(--s); }
.k-live { --s: var(--live); } .k-test { --s: var(--test); } .k-dev { --s: var(--dev); } .k-pre { --s: var(--pre); }
@media (max-width: 899px) {
  .board {
    position: absolute; left: 0; right: 0; bottom: 0; height: auto; border-left: 0; border-top: 1px solid var(--line);
    border-radius: 18px 18px 0 0; padding-bottom: env(safe-area-inset-bottom, 0px); box-shadow: 0 -12px 40px rgba(5, 8, 25, .5);
  }
  .board-head { padding: 10px max(16px, env(safe-area-inset-right, 0px)) 6px max(16px, env(safe-area-inset-left, 0px)); }
  .board-list { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; padding: 2px max(12px, env(safe-area-inset-right, 0px)) 10px max(12px, env(safe-area-inset-left, 0px)); overflow: visible; }
  .row { grid-template-columns: 1fr; gap: 1px; padding: 7px 8px; background: var(--panel-2); min-height: 48px; }
  .row .dockno, .row .pitch { display: none; }
  .row .nm { font-size: 13px; gap: 6px; }
  .row .nm span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .pill { font-size: 9.5px; }
}

/* ---------- Workshop (detail) ---------- */
.shop-backdrop { position: fixed; inset: 0; z-index: 20; background: rgba(6, 9, 28, .55); opacity: 0; transition: opacity .25s; }
.shop-backdrop.open { opacity: 1; }
.shop {
  position: fixed; z-index: 21; left: 50%; top: 50%; transform: translate(-50%, -46%); opacity: 0;
  width: min(560px, calc(100% - 32px)); max-height: calc(100% - 48px);
  background: var(--panel); border: 1px solid var(--line); border-radius: 22px; overflow: hidden; display: flex; flex-direction: column;
  box-shadow: 0 30px 80px rgba(0, 0, 0, .5); transition: transform .3s cubic-bezier(.2,.8,.2,1), opacity .25s;
}
.shop.open { transform: translate(-50%, -50%); opacity: 1; }
@media (max-width: 899px) {
  .shop { left: 0; right: 0; top: auto; bottom: 0; width: 100%; max-height: 92%; border-radius: 22px 22px 0 0; transform: translateY(40px); }
  .shop.open { transform: translateY(0); }
}
.bench { position: relative; flex: none; background: #0a1026; }
.bench svg { display: block; width: 100%; height: auto; }
.bench .readout { position: absolute; left: 16px; top: 14px; font-family: var(--font-mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--c); text-shadow: 0 0 10px var(--c); }
.shop-x { position: absolute; right: 12px; top: 10px; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: rgba(14,21,48,.8); cursor: pointer; font-size: 22px; line-height: 1; display: grid; place-items: center; }
.shop-body { overflow-y: auto; overscroll-behavior: contain; padding: 18px max(20px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 14px; }
.shop-body .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.shop-body h2 { font-family: var(--font-display); font-weight: 800; font-size: 28px; line-height: 1.05; margin: 0; letter-spacing: -0.02em; }
.shop-body .full { font-family: var(--font-mono); font-size: 11px; color: var(--ink-dim); letter-spacing: .08em; text-transform: uppercase; }
.shop-body .lede { font-size: 17px; line-height: 1.45; margin: 0; max-width: 60ch; }
.sect-k { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-dim); margin-bottom: 6px; }
.scan { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
.scan li { padding-left: 18px; position: relative; font-size: 14.5px; }
.scan li::before { content: ""; position: absolute; left: 2px; top: .62em; width: 7px; height: 7px; border-radius: 2px; background: var(--c); box-shadow: 0 0 8px var(--c); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-family: var(--font-mono); font-size: 11.5px; padding: 4px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink-dim); }
.callout { border: 1px solid color-mix(in srgb, var(--c) 45%, var(--line)); background: color-mix(in srgb, var(--c) 9%, transparent); border-radius: 14px; padding: 12px 14px; }
.callout .sect-k { color: var(--c); margin-bottom: 2px; }
.log { font-size: 13.5px; color: var(--ink-dim); margin: 0; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel-2); text-decoration: none; font-weight: 600; font-size: 14.5px; cursor: pointer; }
.btn.primary { flex: 1 1 100%; background: var(--c); border-color: var(--c); color: #0a1026; box-shadow: 0 0 24px color-mix(in srgb, var(--c) 45%, transparent); }
@media (min-width: 900px) { .btn.primary { flex: 0 0 auto; } }
.sealed { font-family: var(--font-mono); font-size: 12px; color: var(--ink-dim); display: inline-flex; align-items: center; min-height: 48px; padding: 0 14px; border: 1px dashed var(--line); border-radius: 12px; }
.nav { display: grid; grid-template-columns: 1fr auto 1fr; gap: 6px; border-top: 1px solid var(--line); padding-top: 10px; }
.nav button { background: none; border: 0; color: var(--ink-dim); cursor: pointer; font-size: 13.5px; min-height: 46px; padding: 0 6px; }
.nav [data-go]:first-child { text-align: left; } .nav [data-go]:last-child { text-align: right; }
.nav [data-close] { color: var(--ink); font-weight: 600; }
.reveal > * { animation: rise .45s both cubic-bezier(.2,.8,.2,1); }
.reveal > *:nth-child(2) { animation-delay: .05s } .reveal > *:nth-child(3) { animation-delay: .1s } .reveal > *:nth-child(4) { animation-delay: .15s } .reveal > *:nth-child(5) { animation-delay: .2s }
@keyframes rise { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
.core-glow { transform-box: fill-box; transform-origin: center; }
.spark { animation: spark .9s ease-out infinite; }
@keyframes spark { 0% { opacity: 1 } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)) } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

</head>
<body>
<div class="app">
  <main class="scene" id="scene" data-time="dusk">
    <svg class="world" id="world" viewBox="40 110 920 640" preserveAspectRatio="xMidYMid meet" role="group" aria-label="A floating island with a workshop for each project and things to play with"></svg>
    <header class="masthead">
      <div class="eyebrow">Ankit Patel · Island Lab</div>
      <h1>Nine workshops, one island</h1>
      <p>I build apps with AI agents. Each building is one of them. Everything else here is just for fun.</p>
    </header>
    <div class="hint" id="hint">Drag, pinch, tap anything</div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div class="dock" id="dock">
      <button class="dock-btn" type="button" id="btn-finds" aria-label="Island secrets found"><svg viewBox="0 0 24 24" fill="none" stroke="#ffcf6b" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3l2.2 5.6L20 9.3l-4.4 3.9 1.3 5.8L12 16l-4.9 3 1.3-5.8L4 9.3l5.8-.7z"/></svg><span class="badge" id="finds-count">0/6</span></button>
      <button class="dock-btn" type="button" id="btn-time" aria-label="Change time of day"></button>
      <button class="dock-btn" type="button" id="btn-sound" aria-pressed="true" aria-label="Sound on"></button>
    </div>
    <section class="finds" id="finds" hidden aria-labelledby="finds-title"></section>
  </main>

  <aside class="board" id="board" aria-labelledby="board-title">
    <div class="board-head">
      <span class="title" id="board-title">Harbor board · my projects</span>
      <span class="sub">tap to go</span>
    </div>
    <ul class="board-list" id="board-list"></ul>
  </aside>
</div>

<div class="shop-backdrop" id="backdrop" hidden></div>
<section class="shop" id="shop" role="dialog" aria-modal="true" aria-labelledby="shop-title" hidden></section>

<script>
/* ---------- Shared project data (from the live portfolio) ---------- */
const APPS = [

let bestSkip = store.get("best", 0), skipping = false, plantedTotal = 0, lightOn = false, beamAng = 0, catAwake = false, doorOpen = false;

function skipStone() {
  if (skipping) return; skipping = true;
  const n = Math.random() < .12 ? 7 + Math.floor(Math.random() * 3) : 1 + Math.floor(Math.random() * 6);
  const stone = el("ellipse", { rx: 4, ry: 2.6, fill: "#5a4f8f" }, pondFx);
  const x0 = POND.x - POND.rx + 6, span = POND.rx * 2 - 10;
  let hops = [], acc = 0, len = 1;
  for (let i = 0; i < n; i++) { hops.push(len); acc += len; len *= .72; }
  const scale = span / acc; let xs = [x0]; hops.forEach((h) => xs.push(xs[xs.length - 1] + h * scale));
  let i = 0;
  function hop() {
    if (i >= n) {
      stone.remove(); skipping = false;
      if (n > bestSkip) { bestSkip = n; store.set("best", n); toast(`<b>${n} skips.</b> New best.`); } else toast(`<b>${n} skip${n > 1 ? "s" : ""}.</b> Best so far: ${bestSkip}.`);
      if (n >= 5) discover("skip");
      return;
    }
    const a = xs[i], b = xs[i + 1], hgt = 26 * hops[i] / hops[0] + 6, t0 = performance.now(), dur = REDUCED ? 1 : 180 + 140 * hops[i];
    (function fly(now) {
      const p = Math.min(1, (now - t0) / dur);
      stone.setAttribute("cx", a + (b - a) * p); stone.setAttribute("cy", POND.y - Math.sin(Math.PI * p) * hgt);
      if (p < 1) requestAnimationFrame(fly);
      else {
        const r = el("ellipse", { cx: b, cy: POND.y, rx: 10, ry: 3.4, fill: "none", stroke: "#fff", "stroke-width": 1.5, class: "ripple" }, pondFx);
        setTimeout(() => r.remove(), 950); sfx.plop(i); i++; hop();
      }
    })(t0);
  }
  hop();
}

function applyCam() {
  const { W, H } = viewSize(), h = cam.w * H / W;
  world.setAttribute("viewBox", `${(cam.cx - cam.w / 2).toFixed(2)} ${(cam.cy - h / 2).toFixed(2)} ${cam.w.toFixed(2)} ${h.toFixed(2)}`);
}
function clampCam() {
  cam.w = Math.max(220, Math.min(home.w * 1.25, cam.w));
  cam.cx = Math.max(140, Math.min(860, cam.cx));
  cam.cy = Math.max(200, Math.min(720, cam.cy));
}
function fitHome() {
  const { W, H } = viewSize();
  const portrait = H > W * 1.05;
  // island, labels and rings span about x 150..850 and y 140..790 (center 465, height 650)
  home.w = portrait ? 680 : Math.max(800, 780 * W / H);
  const topCover = (portrait ? 140 : 95) * home.w / W; // masthead covers the top of the view
  home.cx = portrait ? 508 : 500; home.cy = 465 - topCover / 2;
}
function flyTo(t, ms) {
  if (REDUCED) { Object.assign(cam, t); clampCam(); applyCam(); return; }
  anim = { from: { ...cam }, to: { ...t }, t0: performance.now(), ms: ms || 650 };
}
function toWorld(clientX, clientY) {
  const { W, H, r } = viewSize(), h = cam.w * H / W;
  return { x: cam.cx - cam.w / 2 + (clientX - r.left) / W * cam.w, y: cam.cy - h / 2 + (clientY - r.top) / H * h };
}
const ptrs = new Map(); let dragged = false, pinch0 = null, last = null;
world.addEventListener("pointerdown", (e) => {
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (ptrs.size === 1) { dragged = false; last = { x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY }; }
  if (ptrs.size === 2) {
    const [p, q] = [...ptrs.values()];
    pinch0 = { d: Math.hypot(p.x - q.x, p.y - q.y), w: cam.w, mid: toWorld((p.x + q.x) / 2, (p.y + q.y) / 2) };
    dragged = true;
  }
  anim = null; hideHint();
});
window.addEventListener("pointermove", (e) => {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  const { W } = viewSize(), k = cam.w / W;
  if (ptrs.size === 1 && last) {
    if (!dragged && Math.hypot(e.clientX - last.sx, e.clientY - last.sy) > 8) { dragged = true; world.classList.add("dragging"); }
    if (dragged) { cam.cx -= (e.clientX - last.x) * k; cam.cy -= (e.clientY - last.y) * k; clampCam(); applyCam(); }
    last.x = e.clientX; last.y = e.clientY;
  } else if (ptrs.size === 2 && pinch0) {
    const [p, q] = [...ptrs.values()], d = Math.hypot(p.x - q.x, p.y - q.y);
    cam.w = pinch0.w * pinch0.d / Math.max(d, 1); clampCam(); applyCam();
    const now = toWorld((p.x + q.x) / 2, (p.y + q.y) / 2);
    cam.cx += pinch0.mid.x - now.x; cam.cy += pinch0.mid.y - now.y; clampCam(); applyCam();
  }
});
function endPtr(e) {
  ptrs.delete(e.pointerId);
  if (ptrs.size < 2) pinch0 = null;
  if (ptrs.size === 1) { const p = [...ptrs.values()][0]; last = { x: p.x, y: p.y, sx: p.x, sy: p.y }; }
  if (!ptrs.size) world.classList.remove("dragging");
}
window.addEventListener("pointerup", endPtr); window.addEventListener("pointercancel", endPtr);
world.addEventListener("wheel", (e) => {
  e.preventDefault(); hideHint();
  const before = toWorld(e.clientX, e.clientY);
  cam.w *= Math.exp(e.deltaY * .0015); clampCam(); applyCam();
  const after = toWorld(e.clientX, e.clientY);
  cam.cx += before.x - after.x; cam.cy += before.y - after.y; clampCam(); applyCam();
}, { passive: false });

/* tap routing */
world.addEventListener("click", (e) => {
  if (dragged) { dragged = false; return; }
  findsPanel.hidden = true;
  const b = e.target.closest(".bld"); if (b) { open(b.dataset.id); return; }
  const toy = e.target.closest(".toy");
  if (toy) {
    const k = toy.dataset.toy;
    if (k === "pond") skipStone();
    else if (k === "light") toggleLight();
    else if (k === "cat") pokeCat();
    else if (k === "door") openDoor();
    else if (k === "crystal") ringCrystal(+toy.dataset.n);
    else if (k === "drone") catchDrone(drones.find((d) => d.g === toy));
    return;
  }
  if (e.target.dataset && e.target.dataset.grass) { const p = toWorld(e.clientX, e.clientY); plant(p.x, p.y); }
});
world.addEventListener("keydown", (e) => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const b = e.target.closest(".bld"), toy = e.target.closest(".toy");
  if (!b && !toy) return;
  e.preventDefault();
  e.target.dispatchEvent(new MouseEvent("click", { bubbles: true }));
});
world.addEventListener("pointerover", (e) => { if (e.pointerType !== "mouse") return; const g = e.target.closest(".bld"); hot(g ? g.dataset.id : null); });

let hintGone = false;
function hideHint() { if (hintGone) return; hintGone = true; setTimeout(() => document.getElementById("hint").classList.add("gone"), 1200); }
setTimeout(hideHint, 9000);

/* ---------- Workshop ---------- */
const shop = document.getElementById("shop"), backdrop = document.getElementById("backdrop");
let currentId = null, lastFocus = null, powerTimer = null, camBefore = null;
function benchSVG(a) {
  const sparks = Array.from({ length: 8 }, (_, i) => {
    const ang = i / 8 * Math.PI * 2;
    return `<circle class="spark" cx="280" cy="118" r="2" fill="${a.color}" style="--dx:${(Math.cos(ang) * 46).toFixed(0)}px;--dy:${(Math.sin(ang) * 30).toFixed(0)}px;animation-delay:${(i * .11).toFixed(2)}s"/>`;
  }).join("");
  const pegs = Array.from({ length: 60 }, (_, i) => `<circle cx="${30 + (i % 15) * 34}" cy="${26 + Math.floor(i / 15) * 22}" r="1.6" fill="#2b3769"/>`).join("");
  return `<svg viewBox="0 0 560 200" role="img" aria-label="A glowing toolbench with ${esc(a.name)} on it">
    <rect width="560" height="200" fill="#0a1026"/>${pegs}
    <g stroke="#3b4a86" stroke-width="3" fill="none" stroke-linecap="round"><path d="M70 34 v40 m-10 0 h20"/><path d="M110 30 l18 38"/><circle cx="460" cy="48" r="14"/><path d="M500 30 v44"/><path d="M420 30 l-14 40"/></g>
    <ellipse cx="280" cy="140" rx="210" ry="40" fill="${a.color}" opacity=".10"/>
    <polygon points="60,150 500,150 540,178 20,178" fill="#1c2756"/><polygon points="20,178 540,178 540,190 20,190" fill="#121a3c"/>
    <g class="core-glow" id="core-glow"><circle cx="280" cy="118" r="44" fill="${a.color}" opacity=".18"/><circle cx="280" cy="118" r="30" fill="${a.color}" opacity=".25"/></g>
    <rect x="236" y="140" width="88" height="14" rx="4" fill="#2b3769"/>
    <circle cx="280" cy="112" r="26" fill="#0a1026" stroke="${a.color}" stroke-width="2.5"/>
    <g transform="translate(263,95) scale(1.42)" fill="none" stroke="${a.color}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[a.icon]}</g>
    <g id="sparks" opacity="0">${sparks}</g>
    <rect x="360" y="158" width="130" height="8" rx="4" fill="#2b3769"/><rect id="meter" x="360" y="158" width="0" height="8" rx="4" fill="${a.color}"/>
    <rect x="90" y="156" width="70" height="12" rx="3" fill="#2b3769"/><rect x="96" y="159" width="8" height="6" rx="1" fill="${a.color}" opacity=".8"/><rect x="108" y="159" width="8" height="6" rx="1" fill="${a.color}" opacity=".5"/>
  </svg>`;
}
function render(a) {
  const i = APPS.indexOf(a), prev = APPS[(i + APPS.length - 1) % APPS.length], next = APPS[(i + 1) % APPS.length];
  const links = a.links.map(([label, href, kind]) => `<a class="btn ${kind === "primary" ? "primary" : ""}" href="${href}" target="_blank" rel="noopener">${esc(label)}</a>`).join("");
  shop.style.setProperty("--c", a.color);
  shop.innerHTML = `
    <div class="bench">${benchSVG(a)}<div class="readout" id="readout">Powering up · ${esc(a.dock)}</div>
      <button class="shop-x" id="shop-x" type="button" aria-label="Close workshop">×</button></div>
    <div class="shop-body reveal">
      <div class="top"><div><h2 id="shop-title">${esc(a.name)}</h2>${a.full ? `<div class="full">${esc(a.full)}</div>` : ""}</div>
        <span class="pill k-${a.status[1]}"><span class="dot"></span>${esc(a.status[0])}</span></div>
      <p class="lede">${esc(a.pitch)}</p>
      ${links || a.sealed ? `<div class="actions">${links}${a.sealed ? `<span class="sealed">Live site ${esc(a.sealed.toLowerCase())}</span>` : ""}</div>` : ""}
      <div><div class="sect-k">${a.id === "about" ? "So far" : a.id === "toolbox" ? "On the wall" : "On the bench"}</div><ul class="scan">${a.scan.map((s) => `<li>${esc(s)}</li>`).join("")}</ul></div>
      ${a.standout ? `<div class="callout"><div class="sect-k">${esc(a.standout[0])}</div>${esc(a.standout[1])}</div>` : ""}
      ${a.tags.length ? `<div><div class="sect-k">Built with</div><div class="chips">${a.tags.map((t) => `<span class="chip">${esc(t)}</span>`).join("")}</div></div>` : ""}
      ${a.log ? `<p class="log"><strong>Build log.</strong> ${esc(a.log)}</p>` : ""}
      <div class="nav"><button type="button" data-go="${prev.id}">← ${esc(shortName(prev))}</button><button type="button" data-close>Back to island</button><button type="button" data-go="${next.id}">${esc(shortName(next))} →</button></div>
    </div>`;
  shop.querySelector("#shop-x").addEventListener("click", close);
  shop.querySelector("[data-close]").addEventListener("click", close);
  shop.querySelectorAll("[data-go]").forEach((b) => b.addEventListener("click", () => open(b.dataset.go, true)));
  powerUp(a);
}
function powerUp(a) {
  clearTimeout(powerTimer);
  const meter = shop.querySelector("#meter"), sparks = shop.querySelector("#sparks"), readout = shop.querySelector("#readout"), core = shop.querySelector("#core-glow");
  if (REDUCED) { meter.setAttribute("width", 130); readout.textContent = `${shortName(a)} · online`; return; }
  const t0 = performance.now(), dur = 850; sparks.setAttribute("opacity", 1); tone(220, .6, "sawtooth", .015); tone(440, .5, "sine", .03, .45);
  (function step(now) {
    const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3);
    meter.setAttribute("width", (130 * e).toFixed(1)); core.style.transform = `scale(${(.6 + .5 * e).toFixed(3)})`;
    readout.textContent = p < 1 ? `Powering up · ${Math.round(e * 100)}%` : `${shortName(a)} · online`;
    if (p < 1) requestAnimationFrame(step); else powerTimer = setTimeout(() => sparks.setAttribute("opacity", 0), 900);
  })(t0);
}
function open(id, fromNav) {
  const a = APPS.find((x) => x.id === id); if (!a) return;
  if (!currentId) { lastFocus = document.activeElement; camBefore = { cx: cam.cx, cy: cam.cy, w: cam.w }; }
  currentId = id; findsPanel.hidden = true; hideHint();
  flyTo({ cx: a.x, cy: a.y - a.spot.h * .6, w: 300 });
  render(a);
  backdrop.hidden = false; shop.hidden = false;
  requestAnimationFrame(() => { backdrop.classList.add("open"); shop.classList.add("open"); });
  shop.querySelector(fromNav ? "[data-go]" : "#shop-x").focus({ preventScroll: true });
  try { if (location.hash !== "#" + id) history.replaceState(null, "", "#" + id); } catch (_) {}
}
function close() {
  if (!currentId) return;
  currentId = null;
  shop.classList.remove("open"); backdrop.classList.remove("open");
  setTimeout(() => { if (!currentId) { shop.hidden = true; backdrop.hidden = true; } }, REDUCED ? 0 : 260);
  flyTo(camBefore || home);
  try { history.replaceState(null, "", location.pathname + location.search); } catch (_) {}
  if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true });
}
backdrop.addEventListener("click", close);
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { if (currentId) close(); else findsPanel.hidden = true; }
  if (e.key === "Tab" && currentId) {
    const f = [...shop.querySelectorAll("a,button")]; if (!f.length) return;
    if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
    else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
  }
});
window.addEventListener("hashchange", () => { const id = location.hash.slice(1); if (id && id !== currentId) open(id); });

/* ---------- Loop ---------- */
function tick(now) {
  if (anim) {
    const p = Math.min(1, (now - anim.t0) / anim.ms), e = p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
    cam.cx = anim.from.cx + (anim.to.cx - anim.from.cx) * e; cam.cy = anim.from.cy + (anim.to.cy - anim.from.cy) * e; cam.w = anim.from.w + (anim.to.w - anim.from.w) * e;
    clampCam(); applyCam(); if (p >= 1) anim = null;
  }
  if (!REDUCED && !document.hidden) {
    drones.forEach((d) => {
      const t = now / (2600 + d.i * 700) + d.i * 2.1;
      let x = CX + Math.cos(t) * (RX + 30 + d.i * 22), y = CY - 70 - d.i * 34 + Math.sin(t) * (RY * .5);
      if (d.zip) { const k = (now - d.zip) / 900; if (k >= 1) d.zip = 0; else { y -= Math.sin(Math.PI * k) * 260; x += Math.sin(Math.PI * k) * 80; } }
      d.g.setAttribute("transform", `translate(${x.toFixed(1)} ${y.toFixed(1)})`);
    });
    if (lightOn) {
      beamAng = (now / 2400) % (Math.PI * 2);
      const c = Math.cos(beamAng), s = Math.sin(beamAng);
      // sweep in the island's flat perspective: squash the vertical axis
      beamG.setAttribute("transform", `translate(${LIGHT.x} ${LIGHT.y - 82}) matrix(${c.toFixed(3)} ${(s * .42).toFixed(3)} ${(-s).toFixed(3)} ${(c * .42).toFixed(3)} 0 0)`);
      beam.setAttribute("opacity", (scene.dataset.time === "day" ? .35 : .9).toString());
    }
  } else if (REDUCED && lightOn) {
    beamG.setAttribute("transform", `translate(${LIGHT.x} ${LIGHT.y - 82}) rotate(200)`);
  }
  requestAnimationFrame(tick);
}
function layout() {
  const r = world.getBoundingClientRect();
  if (r.width < 2 || r.height < 2) return;
  setMobileBoardHeight(); fitHome();
  if (!currentId) { Object.assign(cam, home); clampCam(); }
  applyCam();
}
layout();
window.addEventListener("resize", layout);
requestAnimationFrame(layout);
requestAnimationFrame(tick);
if (location.hash.length > 1) open(location.hash.slice(1));
})();
</script>

</body>
